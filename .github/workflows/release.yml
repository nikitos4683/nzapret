name: Build and Release

on:
  workflow_dispatch: # Manual trigger from the GitHub Actions tab

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write # Required to create a release and upload assets

    steps:
      - name: 🛎️ Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Build Module (nzapret)
        # build.sh already contains all the logic for building the .zip archive.
        # Ubuntu-latest runners have bash, zip, sed, and mktemp installed out-of-the-box.
        run: bash build.sh

      - name: 🔍 Get Version Info
        id: vars
        run: |
          set -eu

          # Extract the module version directly from module.prop.
          VERSION=$(grep '^version=' module.prop | cut -d= -f2 | tr -d '\r\n')
          VERSION_CODE=$(grep '^versionCode=' module.prop | cut -d= -f2 | tr -d '\r\n')
          ZIP_NAME="nzapret-${VERSION}.zip"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          RELEASE_NOTES_FILE=".github/release-notes/${VERSION}.md"
          CHANGELOG_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/main/$RELEASE_NOTES_FILE"

          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            echo "::error::Missing release notes file: $RELEASE_NOTES_FILE"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_FILE=$RELEASE_NOTES_FILE" >> "$GITHUB_ENV"

          # Generate update.json for Magisk/KernelSU OTA.
          # Prefer the versioned release-notes file that was used as release body.
          cat <<EOF > update.json
          {
            "version": "$VERSION",
            "versionCode": $VERSION_CODE,
            "zipUrl": "$REPO_URL/releases/download/$VERSION/$ZIP_NAME",
            "changelog": "$CHANGELOG_URL"
          }
          EOF

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "nzapret ${{ env.VERSION }}"
          files: |
            ${{ env.ZIP_NAME }}
            update.json
          body_path: ${{ env.RELEASE_NOTES_FILE }}
          generate_release_notes: false
          draft: false
          prerelease: false
